name: Extract pack-fetcher-backend.zip

on:
  push:
    paths:
      - "pack-fetcher-backend.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract zip
        run: |
          unzip -o pack-fetcher-backend.zip -d .
          rm pack-fetcher-backend.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Extract pack-fetcher-backend.zip"
          git push
          
